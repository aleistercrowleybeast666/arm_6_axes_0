version: '4.1'
name: arm_6_axes_0
type: ARM
deviceName: STM32F407VE
packDir: null
srcDirs:
- App
- BSP
- Motor
- RobotMath
- RobotMotion
- Teach
- Task
- Safety
- Drivers/CyberGear
- Core/Src
- Drivers/STM32F4xx_HAL_Driver/Src
- Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
- Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS
- Track
- Storage
- Sensors
- UI
- Debug
virtualFolder:
  name: <virtual_root>
  files:
  - path: Middlewares/Third_Party/FreeRTOS/Source/tasks.c
  - path: Middlewares/Third_Party/FreeRTOS/Source/queue.c
  - path: Middlewares/Third_Party/FreeRTOS/Source/list.c
  - path: startup_stm32f407xx.s
  - path: Middlewares/Third_Party/FatFs/src/ff.c
  - path: Middlewares/Third_Party/FatFs/src/ff_gen_drv.c
  - path: Middlewares/Third_Party/FatFs/src/diskio.c
  - path: Middlewares/Third_Party/FatFs/src/option/ccsbcs.c
  folders: []
dependenceList: []
outDir: build/eide
miscInfo:
  uid: bb29e6ca75d548f1884ab7ff1e000001
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
      - USE_HAL_DRIVER
      - STM32F407xx
      incList:
      - App
      - BSP
      - Motor
      - RobotMath
      - RobotMotion
      - Teach
      - Task
      - Safety
      - Drivers/CyberGear
      - Core/Inc
      - Drivers/STM32F4xx_HAL_Driver/Inc
      - Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
      - Drivers/CMSIS/Include
      - Drivers/CMSIS/Device/ST/STM32F4xx/Include
      - Middlewares/Third_Party/FreeRTOS/Source/include
      - Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
      - Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS
      - build/generated
      - Track
      - Storage
      - Sensors
      - UI
      - Debug
      - Motor/Backends
      - FATFS/Target
      - FATFS/App
      - Middlewares/Third_Party/FatFs/src
      libList: []
    excludeList:
    - Core/Src/sysmem.c
    - Core/Src/syscalls.c
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ''
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ''
          beforeBuildTasks:
          - name: Version metadata
            command: python tools/version_header.py
            abortAfterFailed: true
          c/cpp-compiler:
            CXX_FLAGS: ''
            C_FLAGS: -Wall -Wextra -Werror
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            arm-thumb-mode: thumb
            misc-control: ''
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes: []
            $toolName: auto
            LD_FLAGS: -Wl,--undefined=RobotIK_Solve,--undefined=RobotFK_Solve,--undefined=RobotJacobian_Compute,--undefined=Version_GetInfo,--print-memory-usage
            LIB_FLAGS: -lc -lm -lnosys
            output-format: elf
            remove-unused-input-sections: true
            use-float-printf: false
        scatterFilePath: STM32F407XX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      OpenOCD:
        baseAddr: '0x08000000'
        bin: ''
        interface: cmsis-dap
        target: stm32f4x
    uploader: OpenOCD
